<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password — LockedIn</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="status-page">
      <a class="wordmark" href="/">Locked<span class="wordmark-in">In</span></a>
      <div id="status-icon" class="status-icon">&hellip;</div>
      <h1 id="status-title" class="status-title">Verifying your reset link&hellip;</h1>
      <p id="status-body" class="status-body">One moment.</p>

      <form id="reset-form" class="status-form" hidden>
        <label class="sr-only" for="password">New password</label>
        <input
          id="password"
          type="password"
          placeholder="New password"
          autocomplete="new-password"
          required
          minlength="6"
        />
        <label class="sr-only" for="password-confirm">Confirm new password</label>
        <input
          id="password-confirm"
          type="password"
          placeholder="Confirm new password"
          autocomplete="new-password"
          required
          minlength="6"
        />
        <p id="form-status" class="status-body" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary btn-large">Set New Password</button>
      </form>

      <a id="back-link" class="btn btn-primary btn-large" href="/admin/" hidden>Go to Dashboard</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
      const client = window.supabase.createClient(
        'https://usqukqpgwexwjiglhpdj.supabase.co',
        'sb_publishable_prtebrryT7htgxbglRYNgA_nxDZM3-k',
      );

      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const bodyEl = document.getElementById('status-body');
      const form = document.getElementById('reset-form');
      const formStatus = document.getElementById('form-status');
      const backLink = document.getElementById('back-link');

      function showError(message) {
        icon.textContent = '!';
        title.textContent = "Couldn't verify this link";
        bodyEl.textContent = message;
      }

      // supabase-js auto-parses the recovery token out of the URL hash on load and fires this
      // event once that session is live — the only reliable signal that the link was valid
      // (checking for a session on plain load races the async parse and false-negatives).
      let linkVerified = false;
      client.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
          linkVerified = true;
          title.textContent = 'Set a new password';
          bodyEl.hidden = true;
          icon.hidden = true;
          form.hidden = false;
        }
      });

      // If the link is missing/expired/already used, no PASSWORD_RECOVERY event ever fires —
      // give up on the "verifying" state after a few seconds rather than spinning forever.
      setTimeout(() => {
        if (!linkVerified) {
          showError('This reset link is invalid or has expired. Request a new one and try again.');
        }
      }, 4000);

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('password-confirm').value;
        if (password !== confirm) {
          formStatus.textContent = "Passwords don't match.";
          return;
        }
        formStatus.textContent = 'Saving…';
        const { error } = await client.auth.updateUser({ password });
        if (error) {
          formStatus.textContent = error.message;
          return;
        }
        await client.auth.signOut();
        form.hidden = true;
        icon.hidden = false;
        icon.textContent = '✓';
        title.textContent = 'Password updated';
        bodyEl.hidden = false;
        bodyEl.textContent = 'Sign in with your new password.';
        backLink.hidden = false;
      });
    </script>
  </body>
</html>
